# Triggered externally every 3 minutes: a cron service (cron-job.org) POSTs a
# repository_dispatch event, which GitHub processes immediately (unlike
# schedule, which is unreliable at high frequency). The schedule below is only
# a fallback in case the external trigger goes silent.
#
# This job pulls per-country visitor stats from the Cloudflare GraphQL
# Analytics API (RUM pageviews), commits the updated data files, then rebuilds
# and redeploys the site.
# Note: a push made with GITHUB_TOKEN does not trigger the Deploy workflow,
# so this job redeploys the site itself after committing. Runs with no data
# change exit before the build/deploy steps.
#
# Required secrets: CF_API_TOKEN (My Profile → API Tokens, Analytics: Read),
# CF_ACCOUNT_ID, CF_SITE_TAG (Web Analytics site tag).

name: Sync visitor stats

on:
  repository_dispatch:
    types: [sync-visitors]
  schedule:
    - cron: "7-59/30 * * * *" # fallback: every 30 minutes at :07/:37
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull Cloudflare stats
        working-directory: site
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_SITE_TAG: ${{ secrets.CF_SITE_TAG }}
        run: node scripts/sync-visitors.mjs

      - name: Commit visitor data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/src/data/visitors-daily.json site/src/data/visitors.json
          git diff --cached --quiet && exit 0
          git commit -m "Update visitor stats"
          git push

      - name: Install and build
        working-directory: site
        run: |
          npm ci
          npm run build

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site/dist
